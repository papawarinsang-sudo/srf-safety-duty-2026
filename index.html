function attendance(){return `<div class="card"><h2>เจ้าหน้าที่เวรอาสาความปลอดภัยโรงงานในวันหยุด</h2><p class="muted" style="margin-top:0">บริษัท ซีพีเอฟ (ประเทศไทย) จำกัด (มหาชน) โรงงานผลิตอาหารสัตว์ศรีราชา</p><p class="muted">ยืนยันรายชื่อผู้เข้าเวร · ระบุผู้เข้าเวรแทน</p><label>วันที่เข้าเวร</label><select id="attendanceDate" onchange="drawAttendance()">${dateOptions(inspectDate)}</select><div id="attendanceRows"></div></div><div class="card duty-guidelines" style="margin-top:14px"><h2>📌 ข้อปฏิบัติระหว่างเข้าเวรอาสา</h2><div class="notice" style="line-height:1.85"><div><b>🍽️ การออกไปรับประทานอาหาร</b><br>ออกไปรับประทานอาหารได้ครั้งละไม่เกิน 2 คน โดยต้องรอให้ผู้ที่ออกไปก่อนกลับมา จึงสามารถออกไปได้</div><div style="margin-top:10px"><b>⏱️ ระยะเวลาพักรับประทานอาหาร</b><br>ไม่เกิน 1 ชั่วโมงต่อมื้อ</div><div style="margin-top:10px"><b>🛡️ ข้อปฏิบัติอื่น ๆ</b><br>ให้อยู่ในดุลพินิจและความรับผิดชอบของหัวหน้าเวร</div></div></div>`}function drawAttendance(){const d=el('attendanceDate').value,s=state.schedule.find(x=>x.date===d);el('attendanceRows').innerHTML=s?[s.leader,...s.members].map((name,i)=>{const k=d+'|'+i,v=state.attendance[k]||{},status=v.status||'pending';return `<div class="item attendance-card"><div class="flex between"><b>${i===0?'👑 หัวหน้าเวร':'👤 ลูกเวร'}: ${esc(name)}</b><span class="pill ${status==='present'?'good':status==='absent'?'bad':''}">${v.savedAt?'✓ บันทึกแล้ว':status==='pending'?'รอยืนยัน':'รอบันทึก'}</span></div><label>สถานะการเข้าเวร</label><div class="attendance-choices" role="group" aria-label="สถานะของ ${esc(name)}">${[['present','✓ มาเข้าเวร'],['replacement','↔ มีคนเข้าแทน'],['absent','✕ ไม่มา'],['pending','… รอยืนยัน']].map(([value,label])=>`<button type="button" class="attendance-choice ${status===value?'is-'+value:''}" onclick="setAttendanceStatus(${i},'${value}')">${label}</button>`).join('')}</div><div id="replacement${i}" ${status==='replacement'?'':'class="hidden"'}><label>ชื่อผู้เข้าเวรแทน</label><input id="ar${i}" value="${esc(v.replacement||'')}" placeholder="ชื่อ–นามสกุล" oninput="markAttendanceUnsaved(${i})"></div><button class="btn" style="margin-top:12px" onclick="saveAttendance(${i})">💾 บันทึกสถานะ</button></div>`}).join(''):'<p>ไม่มีตารางเวรในวันนี้</p>'}

function inspection(){return `<div class="card"><div class="flex between"><h2>แบบตรวจพื้นที่วันหยุด</h2><span class="pill">บันทึกร่างอัตโนมัติ ✓</span></div><p class="muted">ตารางตรวจแบบย่อ เลือกรอบเวลาแล้วตรวจเรียงตามพื้นที่ · ✓ ปกติ · ! ผิดปกติ · – ยังไม่ได้ตรวจ</p><div class="grid2"><div><label>วันที่ตรวจ</label><select id="inspectDate" onchange="inspectDate=this.value;drawInspection()">${dateOptions(inspectDate)}</select></div><div><label>ช่วงเวลาตรวจ</label><select id="inspectRound" onchange="round=this.value;drawInspection()">${rounds.map(r=>`<option value="${r}" ${r===round?'selected':''}>${r} น.</option>`).join('')}</select></div></div><div class="round-pills">${rounds.map(r=>`<button type="button" class="round-pill ${round===r?'active':''}" onclick="round='${r}';render()">${r} ${state.inspectionSubmissions?.[inspectDate+'|'+r]?'✓':''}</button>`).join('')}</div><div id="inspectionBody"></div></div>`}
function drawInspection(){const d=el('inspectDate')?.value||inspectDate;inspectDate=d;const r=round;const completed=areas.filter((a,i)=>{const v=state.inspections[d+'|'+i+'|'+r];return v&&cats.every((c,j)=>v.values?.[j])&&(!Object.values(v.values).some(x=>x!=='normal')||v.note?.trim())}).length;const root=el('inspectionBody');if(!root)return;const people=state.inspectionInspectors?.[d+'|'+r]||'';root.innerHTML=`<div class="notice" style="margin:12px 0"><b>รอบ ${r} น. — ตรวจครบ ${completed}/${areas.length} พื้นที่</b><div class="progress" style="margin:8px 0"><div style="width:${completed/areas.length*100}%"></div></div><span class="muted">เลือกผลตรวจในช่องตาราง · แตะ ✎ เมื่อมีหมายเหตุหรือรูปภาพ</span></div><div class="compact-table-wrap"><table class="compact-inspection"><thead><tr><th>พื้นที่ / จุดตรวจ</th><th>ประตูและ<br>หน้าต่าง</th><th>ไฟฟ้า<br>แสงสว่าง</th><th>อุปกรณ์<br>ไฟฟ้า</th><th>หมายเหตุ</th></tr></thead><tbody>${areas.map((a,i)=>{const k=d+'|'+i+'|'+r,v=state.inspections[k]||{values:{}},vls=v.values||{},bad=Object.values(vls).some(x=>x!=='normal'),ready=cats.every((c,j)=>vls[j])&&(!bad||v.note?.trim());return `<tr id="insrow${i}" class="${ready?'inspection-complete':''}"><td class="compact-area"><b>${i+1}. ${esc(a)}</b><small id="insstatus${i}">${ready?'✓ ครบ':Object.keys(vls).length?'กำลังตรวจ':'ยังไม่ตรวจ'}</small></td>${cats.map((c,j)=>`<td><select class="compact-check ${vls[j]||''}" aria-label="${esc(a)} ${esc(c)}" onchange="autoInspection(${i},${j},this.value);this.className='compact-check '+this.value;document.getElementById('extra${i}').hidden=!(this.value==='abnormal'||this.value==='unchecked');"><option value="" ${!vls[j]?'selected':''}>–</option><option value="normal" ${vls[j]==='normal'?'selected':''}>✓</option><option value="abnormal" ${vls[j]==='abnormal'?'selected':''}>!</option><option value="unchecked" ${vls[j]==='unchecked'?'selected':''}>×</option></select></td>`).join('')}<td><button type="button" class="compact-edit" onclick="let x=document.getElementById('extra${i}');x.hidden=!x.hidden" aria-label="หมายเหตุ ${esc(a)}">✎${v.note?' ●':''}</button></td></tr><tr id="extra${i}" class="compact-extra" ${bad||v.note?'':'hidden'}><td colspan="5"><label>หมายเหตุ ${i+1}. ${esc(a)} (จำเป็นเมื่อผิดปกติหรือไม่ได้ตรวจ)</label><textarea rows="2" placeholder="รายละเอียดสิ่งที่พบ" oninput="autoInspectionNote(${i},this.value)">${esc(v.note||'')}</textarea><label class="photo mini-photo">📷 รูปภาพ (ไม่บังคับ)<input type="file" accept="image/*" capture="environment" onchange="autoInspectionPhoto(${i},this)"></label><div id="inspreview${i}">${photoHTML(v.photo)}</div></td></tr>`}).join('')}</tbody></table></div><div class="inspection-submit"><label for="inspectionInspector"><b>ชื่อผู้ตรวจ รอบ ${r} น.</b> <span style="color:#b53c3c">*</span></label><input id="inspectionInspector" placeholder="ชื่อ–นามสกุลผู้ตรวจประจำรอบ" value="${esc(people)}" oninput="setInspectionInspector(this.value)"><div class="flex between" style="gap:12px;flex-wrap:wrap;margin-top:12px"><div class="muted">ตรวจครบ ${completed}/${areas.length} จุด · บันทึกได้แม้ยังไม่ครบ</div><button class="btn" type="button" onclick="submitInspectionRound()">💾 บันทึกผลตรวจรอบ ${r}</button></div><div id="inspectionSaveMessage" role="status" aria-live="polite" style="margin-top:10px">${inspectionSavedMessage(d,r)}</div></div><p class="muted" style="margin-top:12px">ข้อมูลต้นแบบบันทึกในเบราว์เซอร์เครื่องนี้เท่านั้น · ต้องกรอกชื่อผู้ตรวจเพื่อยืนยันแต่ละรอบ</p>`}
function setInspectionInspector(name){state.inspectionInspectors??={};state.inspectionInspectors[inspectDate+'|'+round]=name;invalidateInspectionSubmission();save()}
function inspectionSavedMessage(d,r){const sub=state.inspectionSubmissions?.[d+'|'+r];if(!sub)return '<span class="muted">ยังไม่ได้กดบันทึกยืนยันรอบนี้ (ข้อมูลร่างถูกเก็บอัตโนมัติ)</span>';return '<span style="color:#18724f;font-weight:700">✓ บันทึกข้อมูลเรียบร้อยแล้ว</span> <span class="muted">เมื่อ '+esc(new Date(sub.savedAt).toLocaleString('th-TH'))+' · '+sub.completed+'/39 จุด</span>'}
function invalidateInspectionSubmission(){state.inspectionSubmissions??={};delete state.inspectionSubmissions[inspectDate+'|'+round];const msg=el('inspectionSaveMessage');if(msg)msg.innerHTML='<span class="muted">มีการแก้ไขข้อมูล กรุณากดบันทึกผลการตรวจอีกครั้ง</span>'}
function submitInspectionRound(){const d=inspectDate,r=round;const inspector=(el('inspectionInspector')?.value||'').trim();if(!inspector){alert('กรุณาระบุชื่อผู้ตรวจประจำรอบ');el('inspectionInspector')?.focus();return}let completed=0;for(let i=0;i<areas.length;i++){const v=state.inspections[d+'|'+i+'|'+r];if(v&&cats.every((c,j)=>v.values?.[j])&&(!Object.values(v.values).some(x=>x!=='normal')||v.note?.trim()))completed++}if(completed===0){alert('กรุณาตรวจอย่างน้อย 1 พื้นที่ก่อนกดบันทึก');return}state.inspectionInspectors??={};state.inspectionInspectors[d+'|'+r]=inspector;state.inspectionSubmissions??={};state.inspectionSubmissions[d+'|'+r]={savedAt:new Date().toISOString(),completed,inspector};save();const msg=el('inspectionSaveMessage');if(msg)msg.innerHTML=inspectionSavedMessage(d,r);alert('✓ บันทึกข้อมูลเรียบร้อยแล้ว\nผู้ตรวจ '+inspector+'\nวันที่ '+dateTH(d)+' รอบ '+r+' น.\nตรวจครบ '+completed+'/'+areas.length+' พื้นที่')}
function updateInspectionProgress(){const d=inspectDate;let completed=0;for(let i=0;i<areas.length;i++){const v=state.inspections[d+'|'+i+'|'+round];const good=!!(v&&cats.every((c,j)=>v.values?.[j])&&(!Object.values(v.values).some(x=>x!=='normal')||v.note?.trim()));if(good)completed++;const st=el('insstatus'+i);if(st)st.textContent=good?'✓ ครบ':v&&Object.keys(v.values||{}).length?'กำลังตรวจ':'ยังไม่ตรวจ';el('insrow'+i)?.classList.toggle('inspection-complete',good);if(v&&Object.values(v.values||{}).some(x=>x==='abnormal'||x==='unchecked')){const ex=el('extra'+i);if(ex)ex.hidden=false}}const notice=el('inspectionBody')?.querySelector('.notice');if(notice){notice.querySelector('b').textContent=`รอบ ${round} น. — ตรวจครบ ${completed}/${areas.length} พื้นที่`;notice.querySelector('.progress div').style.width=(completed/areas.length*100)+'%'}const submit=el('inspectionBody')?.querySelector('.inspection-submit .muted');if(submit)submit.textContent=`ตรวจครบ ${completed}/${areas.length} จุด · บันทึกได้แม้ยังไม่ครบ`}
function chooseInspection(i,j,value,btn){const group=btn.closest('.inspection-choices');const current=btn.getAttribute('aria-pressed')==='true';const next=current?'':value;group.querySelectorAll('button').forEach(b=>{const active=b===btn&&!current;b.className='inspection-choice'+(active?' chosen '+value:'');b.setAttribute('aria-pressed',active?'true':'false')});autoInspection(i,j,next)}
function autoInspection(i,j,value){const k=inspectDate+'|'+i+'|'+round;const v=state.inspections[k]||{values:{},note:'',photo:null};v.values??={};if(value)v.values[j]=value;else delete v.values[j];v.updatedAt=new Date().toISOString();state.inspections[k]=v;invalidateInspectionSubmission();save();updateInspectionProgress()}
function autoInspectionNote(i,value){const k=inspectDate+'|'+i+'|'+round;const v=state.inspections[k]||{values:{},note:'',photo:null};v.note=value;v.updatedAt=new Date().toISOString();state.inspections[k]=v;invalidateInspectionSubmission();save();updateInspectionProgress()}
async function autoInspectionPhoto(i,input){const f=input.files?.[0];if(!f)return;if(f.size>2*1024*1024){alert('รูปต้องไม่เกิน 2 MB ในต้นแบบ');input.value='';return}const photo=await new Promise(resolve=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=()=>resolve(null);rd.readAsDataURL(f)});if(!photo)return alert('ไม่สามารถอ่านรูปได้');const k=inspectDate+'|'+i+'|'+round;const v=state.inspections[k]||{values:{},note:'',photo:null};v.photo=photo;v.updatedAt=new Date().toISOString();state.inspections[k]=v;invalidateInspectionSubmission();save();const prev=el('inspreview'+i);if(prev)prev.innerHTML=photoHTML(photo);input.value=''}
function events(){const d=inspectDate;const pump=(state.firePumpTests||{})[d]||{};const tests=[['outlet','การทดสอบหัวจ่ายน้ำและสายส่งน้ำ'],['nozzle','การทดสอบหัวฉีดน้ำ']];const statusButtons=(key)=>`<div class="pump-choices"><button type="button" class="pump-choice ${pump[key]==='normal'?'active-good':''}" onclick="setPumpStatus('${key}','normal')">✓ ปกติ</button><button type="button" class="pump-choice ${pump[key]==='abnormal'?'active-bad':''}" onclick="setPumpStatus('${key}','abnormal')">! ไม่ปกติ</button></div>`;return `<div class="card"><h2>📝 บันทึกการอยู่เวร</h2><label>วันที่เข้าเวร</label><input type="date" id="eventDate" value="${d}" onchange="inspectDate=this.value;render()"><p class="muted">บันทึกผลทดสอบระบบดับเพลิง และเหตุการณ์ที่เกิดขึ้นระหว่างอยู่เวร</p></div><div class="card"><div class="flex between"><h2>🚒 ผลการทดสอบเครื่องยนต์และปั๊มน้ำดับเพลิง</h2>${pump.savedAt?'<span class="pill good">✓ บันทึกแล้ว</span>':'<span class="pill">รอบันทึก</span>'}</div><p class="muted">เลือกผลตรวจโดยกดปุ่ม และระบุสาเหตุเมื่อพบความผิดปกติ</p>${tests.map(([key,title])=>`<div class="item"><b>${title}</b>${statusButtons(key)}${pump[key]==='abnormal'?`<label>เนื่องจาก / รายละเอียดความผิดปกติ</label><textarea id="pumpNote_${key}" oninput="updatePumpNote('${key}',this.value)" placeholder="ระบุสาเหตุที่ไม่ปกติ">${esc(pump[key+'Note']||'')}</textarea>`:''}</div>`).join('')}<div class="item"><h3>⏱️ ทดสอบเครื่องสูบน้ำดับเพลิง 30 นาที</h3><div class="grid2"><div><label>เวลาก่อนทดสอบ</label><input type="time" id="pumpBefore" value="${esc(pump.before||'')}" onchange="updatePumpTime('before',this.value)"></div><div><label>เวลาหลังทดสอบ</label><input type="time" id="pumpAfter" value="${esc(pump.after||'')}" onchange="updatePumpTime('after',this.value)"></div></div><p class="muted">กรอกเวลาเริ่มต้นและเวลาสิ้นสุดตามที่ทดสอบจริง</p></div><button class="btn" onclick="savePumpTest()">💾 บันทึกผลการทดสอบ</button><div id="pumpSaveStatus" class="muted" style="margin-top:10px" role="status">${pump.savedAt?'✓ บันทึกแล้วเมื่อ '+esc(new Date(pump.savedAt).toLocaleString('th-TH')):''}</div></div><div class="card"><h2>📋 บันทึกเหตุการณ์ระหว่างอยู่เวร</h2><div class="grid2"><div><label>วันที่</label><input type="date" id="eventRecordDate" value="${d}"></div><div><label>ประเภท</label><select id="eventType"><option>งานซ่อมบำรุงที่พบ</option><option>เหตุการณ์ทั่วไป</option><option>ข้อเสนอแนะอื่น ๆ</option></select></div></div><label>พื้นที่ / จุดที่พบ</label><input id="eventArea" placeholder="ชื่อพื้นที่"><label>รายละเอียดเหตุการณ์</label><textarea id="eventText" placeholder="สิ่งที่พบและการดำเนินการเบื้องต้น"></textarea>${photoInput('eventPhoto')}<button class="btn" style="margin-top:12px" onclick="addEvent()">บันทึกเหตุการณ์</button></div><div class="card"><h2>รายการที่บันทึก</h2>${state.events.filter(x=>x.date===d).slice().reverse().map(x=>`<div class="item"><b>${esc(x.type)}</b> · ${dateTH(x.date)}<p>${esc(x.area)} — ${esc(x.text)}</p>${photoHTML(x.photo)}</div>`).join('')||'<p class="muted">ยังไม่มีบันทึกเหตุการณ์ในวันเวรนี้</p>'}</div>`}
function pumpDraft(){state.firePumpTests??={};return state.firePumpTests[inspectDate]??={}}
function setPumpStatus(key,value){const p=pumpDraft();p[key]=value;if(value==='normal')p[key+'Note']='';delete p.savedAt;save();render()}
function updatePumpNote(key,value){const p=pumpDraft();p[key+'Note']=value;delete p.savedAt;save();const x=el('pumpSaveStatus');if(x)x.textContent='มีการแก้ไขที่ยังไม่ได้ยืนยันบันทึก'}
function updatePumpTime(key,value){const p=pumpDraft();p[key]=value;delete p.savedAt;save();const x=el('pumpSaveStatus');if(x)x.textContent='มีการแก้ไขที่ยังไม่ได้ยืนยันบันทึก'}
function savePumpTest(){const p=pumpDraft();if(!p.outlet||!p.nozzle)return alert('กรุณาเลือกผลตรวจทั้ง 2 รายการ');if((p.outlet==='abnormal'&&!(p.outletNote||'').trim())||(p.nozzle==='abnormal'&&!(p.nozzleNote||'').trim()))return alert('กรุณาระบุสาเหตุของรายการที่ไม่ปกติ');if(!p.before||!p.after)return alert('กรุณากรอกเวลาก่อนและหลังทดสอบ');p.savedAt=new Date().toISOString();save();render();showSavedToast('✓ บันทึกผลการทดสอบเครื่องสูบน้ำดับเพลิงแล้ว')}

function special(){const ts=getTasks(specialDate);return `<div class="card"><div class="flex between"><h2>ประกาศและหน้าที่พิเศษประจำสัปดาห์</h2><span class="pill">รูปไม่บังคับ</span></div><label>วันที่มอบหมายงาน</label><select id="specialDate" onchange="specialDate=this.value;render()">${dateOptions(specialDate)}</select><div class="notice" style="margin-top:12px">📢 แจ้งรายชื่อและหน้าที่เวรอาสา วันที่ ${dateTH(specialDate)}<br>งานตรวจตู้เก็บสายฉีดน้ำดับเพลิงอยู่ในส่วนตรวจอุปกรณ์ด้านบนเพียงรายการเดียว ไม่ต้องกรอกซ้ำ · งานพิเศษแยกจากแบบตรวจพื้นที่ 39 จุด</div>${ts.map((t,i)=>{const k=specialDate+'|'+t.id,v=state.tasks[k]||{};return `<div class="item" ${t.id.startsWith('custom')?'data-custom-task="true"':''}><div class="flex between"><strong>${i+1}. ${esc(t.title)}</strong><span class="pill ${v.status==='done'?'good':v.status==='issue'?'bad':''}">${v.savedAt?'✓ บันทึกแล้ว':v.status==='done'?'เสร็จแล้ว':v.status==='issue'?'พบปัญหา':'รอรายงาน'}</span></div><p class="muted">${esc(t.detail)}</p>${photoHTML(t.photo)}${t.fixed?``:`<span class="pill">🔐 จป. แก้ไขคำสั่งงานในหน้าหลังบ้าน</span>`}<label>ผลการปฏิบัติงาน</label><select id="st${i}"><option value="pending" ${!v.status||v.status==='pending'?'selected':''}>ยังไม่ได้ดำเนินการ</option><option value="done" ${v.status==='done'?'selected':''}>ดำเนินการแล้ว</option><option value="issue" ${v.status==='issue'?'selected':''}>พบปัญหา</option></select><label>รายละเอียดผลการทำงาน</label><textarea id="sn${i}">${esc(v.note||'')}</textarea>${photoInput('sp'+i)}${photoHTML(v.photo)}${v.savedAt?'<div class="saved-mark">✓ บันทึกแล้ว</div>':''}<button class="btn alt" style="margin-top:10px" onclick="saveSpecial(${i},'${t.id}')">บันทึกผลปฏิบัติงาน</button></div>`}).join('')}</div><div class="card" id="specialEditPanel" style="display:none"><h2>✏️ แก้ไขงานพิเศษ</h2><p class="muted" id="specialEditHint"></p><input type="hidden" id="specialEditId"><label>ชื่องาน</label><input id="specialEditTitle"><label>รายละเอียด / จุดที่ตรวจ</label><texta `}).join('')}</div><div id="historyDetail"></div>`}function showHistory(d){const s=state.schedule.find(x=>x.date===d);const ins=Object.entries(state.inspections).filter(([k])=>k.startsWith(d+'|'));el('historyDetail').innerHTML=`<div class="card"><h2>รายละเอียด ${dateTH(d)}</h2><p><b>เวรตามแผน:</b> ${s?esc([s.leader,...s.members].join(', ')):'ไม่มีข้อมูล'}</p><h3>ผลตรวจพื้นที่ (${ins.length}/195)</h3>${ins.map(([k,v])=>{const p=k.split('|');return `<div class="row"><b>${+p[1]+1}. ${esc(areas[+p[1]])}</b> · ${p[2]}<div class="muted">${cats.map((c,i)=>c+': '+({normal:'ปกติ',abnormal:'ผิดปกติ',unchecked:'ไม่ได้ตรวจ'}[v.values[i]]||'-')).join(' | ')}</div>${v.note?`<p>${esc(v.note)}</p>`:''}${photoHTML(v.photo)}</div>`}).join('')||'<p class="muted">ยังไม่มีผลตรวจ</p>'}<h3>บันทึกการอยู่เวร · ผลทดสอบปั๊มน้ำดับเพลิง</h3>${(()=>{const p=state.firePumpTests?.[d];return p?`<div class="item">หัวจ่ายน้ำ/สายส่งน้ำ: ${p.outlet==='normal'?'ปกติ':p.outlet==='abnormal'?'ผิดปกติ':'ยังไม่ตรวจ'} ${esc(p.outletNote||'')}<br>หัวฉีดน้ำ: ${p.nozzle==='normal'?'ปกติ':p.nozzle==='abnormal'?'ผิดปกติ':'ยังไม่ตรวจ'} ${esc(p.nozzleNote||'')}<br>ก่อนทดสอบ: ${esc(p.before||'-')} · หลังทดสอบ: ${esc(p.after||'-')}</div>`:'<p class="muted">ยังไม่มีผลทดสอบ</p>'})()}<h3>บันทึกเหตุการณ์</h3>${state.events.filter(e=>e.date===d).map(e=>`<div class="item">${esc(e.type)}: ${esc(e.text)}${photoHTML(e.photo)}</div>`).join('')||'<p class="muted">ไม่มีบันทึก</p>'}<h3>งานพิเศษ</h3>${getTasks(d).map(t=>{const v=state.tasks[d+'|'+t.id];return `<div class="row">${esc(t.title)} — ${v?.status==='done'?'เสร็จแล้ว':v?.status==='issue'?'พบปัญหา':'ยังไม่รายงาน'} ${photoHTML(v?.photo)}</div>`}).join('')}</div>`;el('historyDetail').scrollIntoView({behavior:'smooth',block:'start'})}
function reports(){const ds=dates();return `<div class="card"><div class="flex between"><h2>รายงานสรุปสำหรับ จป.</h2><button class="btn" onclick="downloadCSV()">⬇ ส่งออก CSV</button></div><p class="muted">รายงานผลตรวจย้อนหลังจากข้อมูลที่บันทึกในต้นแบบ</p><div class="tablewrap"><table><thead><tr><th>วันที่</th><th>ผลตรวจ /195</th><th>ผิดปกติ</th><th>เหตุการณ์</th><th>งานพิเศษที่รายงาน</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${dateTH(d)}</td><td>${countChecks(d)}</td><td>${issues(d)}</td><td>${state.events.filter(e=>e.date===d).length}</td><td>${Object.keys(state.tasks).filter(k=>k.startsWith(d+'|')).length}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><h2>รายการผิดปกติจากการตรวจ</h2>${Object.entries(state.inspections).filter(([k,v])=>Object.values(v.values||{}).includes('abnormal')).map(([k,v])=>{const p=k.split('|');return `<div class="item"><b>${dateTH(p[0])} · ${esc(areas[+p[1]])} · ${p[2]}</b><p>${esc(v.note||'')}</p>${photoHTML(v.photo)}</div>`}).join('')||'<p class="muted">ยังไม่มีรายการผิดปกติ</p>'}</div>`}function exportBackup(){const blob=new Blob([JSON.stringify({format:'SRF-SAFETY-BACKUP',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='SRF_Safety_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

 const reportsSection=host.querySelector('#adminReports');
 const summaryCard=[...host.querySelectorAll('.card')].find(c=>c.querySelector('h2')?.textContent.includes('สรุปข้อมูลหลังบ้าน'));
 const trackingCard=[...host.querySelectorAll('.card')].find(c=>c.querySelector('h2')?.textContent.includes('ติดตามผลปฏิบัติงาน'));
 if(!panel||!ledger||!addCard||!historySection||!reportsSection)return;
 const nav=document.createElement('div');nav.className='admin-workspace-nav';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','เมนูหลังบ้าน จป.');
 nav.innerHTML=adminWorkspaces.map(([key,icon,label])=>`<button type="button" class="admin-workspace-tab" data-admin-tab="${key}" role="tab" onclick="setAdminWorkspace('${key}')"><span class="admin-workspace-icon">${icon}</span><span>${label}</span></button>`).join('');
 const first=host.querySelector('.flex.between');
 if(first)first.after(nav);else host.prepend(nav);
 const wrap=(key,items)=>{const sec=document.createElement('section');sec.dataset.adminWorkspace=key;sec.className='admin-workspace-content';items.forEach(node=>{if(node)sec.appendChild(node)});host.appendChild(sec)};
 // Ledger was previously appended inside the assignment panel; move it to its own page.
 wrap('assign',[summaryCard,panel]);
 wrap('ledger',[ledger]);
 wrap('tasks',[addCard,trackingCard]);
 wrap('history',[historySection]);
 wrap('reports',[reportsSection]);
 setAdminWorkspace(adminWorkspace);
}

// One duty date across every work page. Select it once on Dashboard.
const SRF_DUTY_DATE_KEY='srfUnifiedDutyDate';
let unifiedDutyDate=(()=>{try{return localStorage.getItem(SRF_DUTY_DATE_KEY)||initialDutyDate}catch(e){return initialDutyDate}})();
function syncDutyDate(date){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;
 unifiedDutyDate=date;inspectDate=date;specialDate=date;adminDate=date;equipmentDate=date;
 try{localStorage.setItem(SRF_DUTY_DATE_KEY,date)}catch(e){}
 render();
}
function installUnifiedDutyDate(){
 const host=el('content');if(!host)return;
 const isDashboard=page==='dashboard';
 const header=document.createElement('section');
 header.className='unified-duty-date'+(isDashboard?' is-dashboard':'');
 header.innerHTML=isDashboard?`<div class="duty-date-eyebrow">🗓️ เลือกวันเข้าเวรครั้งเดียว</div><h2>วันที่ใช้บันทึกข้อมูลทุกหน้า</h2><p>เลือกวันเข้าเวรที่นี่ แล้วระบบจะใช้วันเดียวกันในหน้าการเข้าเวร ตรวจพื้นที่ บันทึกเหตุการณ์ งานพิเศษ และหลังบ้าน จป.</p><label for="unifiedDutyDate">วันที่เข้าเวร</label><select id="unifiedDutyDate" onchange="syncDutyDate(this.value)">${dateOptions(unifiedDutyDate)}</select><div class="duty-date-confirm">✓ วันที่เลือก: <strong>${dateTH(unifiedDutyDate)}</strong></div>`:`<div class="duty-date-current"><span>🗓️ วันที่เข้าเวรที่เลือก</span><strong>${dateTH(unifiedDutyDate)}</strong></div><button type="button" class="btn alt" onclick="go('dashboard');document.getElementById('unifiedDutyDate')?.focus()">เปลี่ยนวันที่ที่หน้าภาพรวม →</button>`;
 host.prepend(header);
 // Remove redundant per-page date selectors; all forms follow the dashboard date.
 const redundant=['attendanceDate','inspectDate','eventDate','eventRecordDate','specialDate'];
 for(const id of redundant){const control=el(id);if(!control)continue;
   if(id==='eventRecordDate'){control.value=unifiedDutyDate;control.readOnly=true;control.closest('div')?.classList.add('unified-date-hidden');continue}
   control.value=unifiedDutyDate;
   const label=control.previousElementSibling;
   if(label?.tagName==='LABEL')label.classList.add('unified-date-hidden');
   control.classList.add('unified-date-hidden');
 }
 // Admin and equipment assignment date selects use the same shared day.
 if(page==='admin'&&adminUnlocked){
   for(const select of host.querySelectorAll('select')){
     const attr=select.getAttribute('onchange')||'';
     if(attr.includes('adminDate=this.value')||attr.includes('equipmentDate=this.value')){
       select.value=unifiedDutyDate;select.classList.add('unified-date-hidden');
       const label=select.previousElementSibling;
       if(label?.tagName==='LABEL')label.classList.add('unified-date-hidden');
     }
   }
 }
}
// Make previously independent dates consistent on first load.
inspectDate=unifiedDutyDate;specialDate=unifiedDutyDate;adminDate=unifiedDutyDate;equipmentDate=unifiedDutyDate;
const renderBeforeAdminWorkspaces=render;
render=function(){renderBeforeAdminWorkspaces();splitAdminWorkspaces();installUnifiedDutyDate()};

// Prototype-only admin account: stored separately in this browser. NOT server authentication.
const ADMIN_ACCOUNT_KEY='srf_admin_account_v1';
function adminAccount(){try{return JSON.parse(localStorage.getItem(ADMIN_ACCOUNT_KEY)||'null')}catch(e){return null}}
function adminLoginView(){
 const account=adminAccount(),setup=!account;
 return `<div class="card admin-auth"><div class="auth-mark">🔐</div><h2>${setup?'สร้างบัญชีผู้ดูแล จป.':'เข้าสู่ระบบหลังบ้าน จป.'}</h2><p class="muted">${setup?'ตั้งชื่อผู้ใช้และรหัสผ่านสำหรับเข้าหลังบ้านบนเบราว์เซอร์นี้':'กรอกชื่อผู้ใช้และรหัสผ่านที่ตั้งไว้'}</p>
 <form onsubmit="adminSubmit(event)"><label for="adminUsername">ชื่อผู้ใช้ (Username)</label><input id="adminUsername" name="username" autocomplete="username" minlength="4" maxlength="40" required placeholder="เช่น safety_admin">
 <label for="adminPassword">รหัสผ่าน (Password)</label><div class="password-wrap"><input id="adminPassword" name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" minlength="8" required placeholder="อย่างน้อย 8 ตัวอักษร"><button class="show-password" type="button" onclick="toggleAdminPassword('adminPassword',this)">แสดง</button></div>
 ${setup?`<label for="adminPasswordConfirm">ยืนยันรหัสผ่าน</label><div class="password-wrap"><input id="adminPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required placeholder="กรอกรหัสผ่านอีกครั้ง"><button class="show-password" type="button" onclick="toggleAdminPassword('adminPasswordConfirm',this)">แสดง</button></div>`:''}
 <p id="adminAuthError" class="auth-error" role="alert" hidden></p><button class="btn" type="submit">${setup?'✨ สร้างบัญชีและเข้าหลังบ้าน':'เข้าสู่หลังบ้าน จป. →'}</button></form>
 <div class="notice auth-help">⚠️ <strong>บัญชีทดลองสำหรับเว็บ HTML เท่านั้น</strong> บัญชีนี้ใช้ได้เฉพาะเบราว์เซอร์ที่สร้างไว้ ไม่ซิงก์ข้ามโทรศัพท์/คอมพิวเตอร์ และไม่สามารถป้องกันผู้ที่เข้าถึงโค้ดหรือข้อมูลในเครื่องได้จริง ก่อนใช้งานกับข้อมูลพนักงานจริงต้องมีระบบล็อกอินและตรวจสอบสิทธิ์ฝั่งเซิร์ฟเวอร์</div></div>`;
}
function toggleAdminPassword(id,btn){const input=el(id);if(!input)return;input.type=input.type==='password'?'text':'password';btn.textContent=input.type==='password'?'แสดง':'ซ่อน'}
function adminAuthError(message){const box=el('adminAuthError');if(box){box.textContent=message;box.hidden=false}}
async function adminDigest(password,salt){
 if(!window.crypto?.subtle)throw Error('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส กรุณาเปิดผ่าน HTTPS เช่น GitHub Pages');
 const bytes=new TextEncoder().encode(salt+':'+password);
 const digest=await crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');
}
async function adminSubmit(event){
 event.preventDefault();const username=el('adminUsername').value.trim(),password=el('adminPassword').value;
 if(username.length<4)return adminAuthError('ชื่อผู้ใช้ต้องมีอย่างน้อย 4 ตัวอักษร');
 if(password.length<8)return adminAuthError('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
 const account=adminAccount();
 try{
  if(!account){
   if(password!==el('adminPasswordConfirm').value)return adminAuthError('รหัสผ่านทั้งสองช่องไม่ตรงกัน');
   const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
   localStorage.setItem(ADMIN_ACCOUNT_KEY,JSON.stringify({username,salt,hash:await adminDigest(password,salt)}));
   adminUnlocked=true;render();showSavedToast('สร้างบัญชีผู้ดูแลบนเครื่องนี้เรียบร้อยแล้ว');
  }else{
   const hash=await adminDigest(password,account.salt);
   if(username!==account.username||hash!==account.hash)return adminAuthError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
   adminUnlocked=true;render();
  }
 }catch(e){adminAuthError(e.message||'ไม่สามารถเข้าสู่ระบบได้')}
}
function adminLogout(){adminUnlocked=false;render()}
function adminSettingsPanel(){
 const account=adminAccount();if(!adminUnlocked||!account)return '';
 return `<details class="admin-settings"><summary>⚙️ จัดการบัญชีผู้ดูแล (${esc(account.username)})</summary><p class="muted">เปลี่ยนรหัสผ่านสำหรับเบราว์เซอร์นี้</p><form onsubmit="adminChangePassword(event)"><label>รหัสผ่านปัจจุบัน</label><input id="adminOldPassword" type="password" autocomplete="current-password" minlength="8" required><label>รหัสผ่านใหม่</label><input id="adminNewPassword" type="password" autocomplete="new-password" minlength="8" required><label>ยืนยันรหัสผ่านใหม่</label><input id="adminNewPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required><p id="adminPasswordError" class="auth-error" role="alert"></p><button class="btn" type="submit">บันทึกรหัสผ่านใหม่</button></form></details>`;
}
async function adminChangePassword(event){
 event.preventDefault();const account=adminAccount();if(!account)return;
 const error=el('adminPasswordError');error.textContent='';
 const old=el('adminOldPassword').value,pass=el('adminNewPassword').value;
 if(pass!==el('adminNewPasswordConfirm').value){error.textContent='รหัสผ่านใหม่ไม่ตรงกัน';return}
 try{
  if(await adminDigest(old,account.salt)!==account.hash){error.textContent='รหัสผ่านปัจจุบันไม่ถูกต้อง';return}
  const salt=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
  localStorage.setItem(ADMIN_ACCOUNT_KEY,JSON.stringify({...account,salt,hash:await adminDigest(pass,salt)}));
  render();showSavedToast('เปลี่ยนรหัสผ่านเรียบร้อยแล้ว');
 }catch(e){error.textContent=e.message||'เกิดข้อผิดพลาด'}
}
const renderWithAdminAccount=render;
render=function(){renderWithAdminAccount();if(page==='admin'&&adminUnlocked){const host=el('content');if(host){const node=document.createElement('div');node.innerHTML=adminSettingsPanel();host.appendChild(node)}}};

// Start only after every let/const initialization, including the admin workspace.
render();updateLiveDate();

</script></body></html>
